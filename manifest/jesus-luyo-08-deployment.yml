# kubectl apply -f jesus-luyo-08-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-ai-be
  namespace: jesus-luyo-08
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-ai-be
  template:
    metadata:
      labels:
        app: api-ai-be
    spec:
      containers:
        - name: api-ai-be
          image: vidalluyo0/08-jesus-luyo:1.0   # Tu imagen Docker en Docker Hub
          imagePullPolicy: IfNotPresent        # Evitar traer siempre la última versión si hay una actual
          ports:
            - containerPort: 8085
          envFrom:
            - secretRef:
                name: credentials  # Esto cargará todos los valores como variables de entorno
