# consultar versión de minikube
minikube version

# consultar si minikube esta en start o stop
minikube status

# iniciar clúster kubernetes
minikube start

# ingressar a la carpeta de los manifiestos de kubernetes (manifest)
cd manifest

# listar namespace
kubectl get namespace
kubectl get ns

# Solo crea
kubectl create namespace [nombre]
kubectl apply (crea y/o actualiza)

# crear un namespace "vidal" por comando mediante un archivo: "1-namespace.yml"
kubectl apply -f 1-namespace.yml

# crear un secret "creadentials" dentro del namespace "vidal" por comando mediante un archivo: "2-secret.yml"
kubectl apply -f 2-secret.yml

# crear un service "age-detector-be" dentro del namespace "vidal" por comando mediante un archivo: "3-service.yml"
kubectl apply -f 3-service.yml

# crear un deployment "age-detector-be" dentro del namespace "vidal" por comando mediante un archivo: "4-deployment.yml"
kubectl apply -f 4-deployment.yml



# consultar namespace en uso por "default" | LINUX
kubectl config view --minify | grep namespace

# consultar namespace en uso por "default" | WINDOWS
kubectl config view --minify | findstr namespace



# cambiar un namespace en uso por "default" a "vidal"
kubectl config set-context --current --namespace=vidal



# consultar todos los recursos de un namespace "vidal"
kubectl get all -n vidal

# consultar todos los recursos y secret de un namespace "vidal"
kubectl get all,secrets -n vidal

# listar services del namespace "vidal"
minikube service age-detector -n vidal
minikube service list

# probar el microservicio dentro del clúster con curl
curl http://192.168.49.2:30001/v1/api/instagram/profile/instagram
curl http://192.168.49.2:30001/v1/api/age-detector/1

# crear un túnel de puerto la máquina local (host) y el clúster de Kubernetes
kubectl port-forward service/age-detector 8085:30001

# ver los logs del pod (logs del proyecto)
kubectl logs nombre-pod